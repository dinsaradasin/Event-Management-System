<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Event | EventNode</title>
    <style>
        :root { 
            --primary: #4F46E5; 
            --bg-page: #F1F5F9; 
            --card-bg: #FFFFFF; 
            --text-main: #0F172A; 
            --text-muted: #475569; 
            --border: #CBD5E1; 
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body { 
            background: radial-gradient(circle at 50% -20%, #E0E7FF 0%, #F1F5F9 100%); 
            color: var(--text-main);
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
        }

        .top-menu { 
            background: var(--card-bg); 
            padding: 20px 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--border); 
        }
        .top-menu h1 { color: var(--primary); font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
        
        .nav-link { 
            color: var(--primary); background-color: #EEF2FF; 
            border: 1px solid #C7D2FE; text-decoration: none; 
            font-size: 14px; font-weight: 600; padding: 8px 16px;
            border-radius: 6px; transition: all 0.2s; 
        }
        .nav-link:hover { 
            background-color: var(--primary); color: white; 
            border-color: var(--primary); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
        }

        .main-wrapper { 
            flex: 1; display: flex; justify-content: center; 
            align-items: center; padding: 40px 20px; 
        }

        .form-box { 
            background: var(--card-bg); padding: 40px; 
            border-radius: 16px; border: 1px solid var(--border); 
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); 
            width: 100%; max-width: 500px;
            transition: transform 0.3s ease, box-shadow 0.3s ease; 
        }
        .form-box:hover { transform: translateY(-4px); box-shadow: 0 15px 30px -5px rgba(0,0,0,0.1); }

        .form-box h2 { margin-bottom: 8px; font-size: 24px; letter-spacing: -0.5px; }
        .form-description { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }

        .input-group { margin-bottom: 20px; }
        .input-row { display: flex; gap: 16px; }
        .input-row .input-group { flex: 1; }
        .input-group label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
        .input-group input { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; background: #F8FAFC; transition: all 0.2s; }
        .input-group input:focus { border-color: var(--primary); background: white; outline: none; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
        
        .button-group { display: flex; gap: 16px; margin-top: 32px; }
        .btn { flex: 1; padding: 14px; border: none; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; transition: all 0.2s; text-align: center; text-decoration: none; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background-color: #4338CA; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
        .btn-secondary { background: #F1F5F9; color: var(--text-main); border: 1px solid var(--border); }
        .btn-secondary:hover { background: #E2E8F0; }

        /* --- Custom Modal for Copying the Code --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: white; padding: 32px; border-radius: 16px;
            width: 100%; max-width: 400px; text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
        }
        .modal-content h3 { color: var(--text-main); margin-bottom: 8px; font-size: 20px; }
        .modal-content p { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
        .code-display {
            background: #F8FAFC; border: 2px dashed var(--primary); border-radius: 8px;
            padding: 16px; font-size: 24px; font-weight: bold; letter-spacing: 4px;
            color: var(--primary); margin-bottom: 16px;
        }
    </style>
</head>
<body>

    <nav class="top-menu">
        <h1>EventNode</h1>
        <a href="dashboard.html" class="nav-link">Back to Dashboard</a>
    </nav>

    <div class="main-wrapper">
        <div class="form-box">
            <h2>Host a New Event</h2>
            <p class="form-description">Set up the details for your secure event space.</p>

            <form action="GenerateEventCode" method="POST">
                <div class="input-group">
                    <label>Event Title</label>
                    <input type="text" name="event_title" placeholder="e.g., Annual Tech Conference 2026" required>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label>Date</label>
                        <input type="date" name="event_date" required>
                    </div>
                    <div class="input-group">
                        <label>Time</label>
                        <input type="time" name="event_time" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Location</label>
                    <input type="text" name="event_location" placeholder="e.g., Main Auditorium" required>
                </div>
                
                <div class="input-group">
                    <label>Maximum Capacity</label>
                    <input type="number" name="capacity" placeholder="e.g., 150" required>
                </div>

                <div class="button-group">
                    <a href="dashboard.html" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Create Event</button>
                </div>
            </form>
        </div>
    </div>

    <!-- The Popup Modal -->
    <div id="code-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Event Created! 🎉</h3>
            <p>Share this unique code with your participants to let them join.</p>
            <div class="code-display" id="generated-code">XXXXXX</div>
            
            <div style="display: flex; gap: 12px;">
                <button onclick="copyCode()" class="btn btn-primary" id="copy-btn">Copy Code</button>
                <button onclick="closeModal()" class="btn btn-secondary">Go to Dashboard</button>
            </div>
        </div>
    </div>

    <script>
     
        const urlData = new URLSearchParams(window.location.search);
        const newEventCode = urlData.get('code');

        if (newEventCode !== null) {
            document.getElementById('generated-code').innerText = newEventCode;
            document.getElementById('code-modal').style.display = 'flex';
        }

    
        function copyCode() {
            const codeToCopy = document.getElementById('generated-code').innerText;
            navigator.clipboard.writeText(codeToCopy).then(() => {
                const btn = document.getElementById('copy-btn');
                btn.innerText = "Copied! ✔️";
                btn.style.backgroundColor = "#10B981"; 
            });
        }

        function closeModal() {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
