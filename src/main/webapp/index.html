<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventNode | Secure Login</title>
    <style>
        :root {
            --primary: #4F46E5;
            --bg-page: #F1F5F9;
            --card-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #475569;
            --border: #CBD5E1;
            --error-bg: #FEF2F2;
            --error-border: #FECACA;
            --error-text: #991B1B;
            --error-accent: #EF4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

        body {
            background: radial-gradient(circle at 50% -20%, #E0E7FF 0%, #F1F5F9 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden; 
        }

     
        .toast {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-150%);
            opacity: 0;
            background-color: var(--error-bg);
            border: 1px solid var(--error-border);
            border-left: 4px solid var(--error-accent);
            padding: 16px 24px;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 1000;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); 
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast-icon { font-size: 20px; }
        .toast-content h4 { color: var(--error-text); font-size: 14px; margin-bottom: 4px; }
        .toast-content p { color: #B91C1C; font-size: 13px; }
        
        .toast-close {
            background: none; border: none; color: var(--error-text);
            font-size: 20px; cursor: pointer; opacity: 0.6; padding-left: 12px;
        }
        .toast-close:hover { opacity: 1; }

     
        .login-box {
            background-color: var(--card-bg);
            padding: 48px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 420px;
            transition: transform 0.3s ease;
        }

        .login-box:hover { transform: translateY(-5px); }

        .brand-header { text-align: center; margin-bottom: 32px; }
        .brand-header h2 { color: var(--primary); font-size: 32px; letter-spacing: -1px; margin-bottom: 8px; }
        .brand-header p { color: var(--text-muted); font-size: 14px; }

        .input-wrapper { margin-bottom: 24px; }
        .input-wrapper label {
            display: block; margin-bottom: 10px;
            color: var(--text-muted); font-size: 12px;
            font-weight: 700; text-transform: uppercase;
        }

        .input-wrapper input {
            width: 100%; padding: 14px;
            border: 1px solid var(--border);
            border-radius: 8px; font-size: 16px;
            background: #F8FAFC;
            transition: all 0.2s;
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
            background: white; outline: none;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .sign-in-button {
            width: 100%; padding: 16px;
            background-color: var(--primary);
            color: white; border: none;
            border-radius: 8px; font-size: 16px;
            font-weight: 600; cursor: pointer;
            transition: all 0.2s;
        }

        .sign-in-button:hover { background-color: #4338CA; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }

        .register-prompt { text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-muted); }
        .register-prompt a { color: var(--primary); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

   
    <div id="error-toast" class="toast">
        <div class="toast-icon">⚠️</div>
        <div class="toast-content">
            <h4>Authentication Failed</h4>
            <p>Incorrect email or password. Please try again.</p>
        </div>
        <button class="toast-close" onclick="closeToast()">×</button>
    </div>

 
    <div class="login-box">
        <div class="brand-header">
            <h2>EventNode</h2>
            <p>Secure Access Portal</p>
        </div>
        
        <form action="LoginHandler" method="POST">
            <div class="input-wrapper">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="name@company.com" required>
            </div>
            
            <div class="input-wrapper">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="sign-in-button">Sign In</button>
        </form>

        <div class="register-prompt">
            Don't have an account? <a href="register.html">Register here</a>
        </div>
    </div>
    
  
    <script>
       
        const urlParams = new URLSearchParams(window.location.search);
        
        if (urlParams.has('error')) {
            const toast = document.getElementById('error-toast');
            
            
            toast.classList.add('show');
            
         
            setTimeout(() => {
                closeToast();
            }, 5000);
            
           
            window.history.replaceState(null, null, window.location.pathname);
        }

      
        function closeToast() {
            document.getElementById('error-toast').classList.remove('show');
        }
    </script>
</body>
</html>
